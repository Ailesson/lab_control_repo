<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Reserva FEEC</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="../static/login.css">
</head>

<body>

    <!-- Acesso para estagiários -->
    <div style="position: absolute; top: 20px; right: 20px; z-index: 1000;">

        <a href="./estagiario.html"
           class="btn btn-outline-info btn-sm fw-bold shadow-sm d-flex align-items-center gap-1"
           style="background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px);">

            <i class="bi bi-person-badge"></i>
            Acesso Estagiário

        </a>

    </div>

    <!-- Cartão principal -->
    <div class="login-wrapper">

        <div class="card login-card"
             style="border-top: 4px solid #dc3545;">

            <!-- Cabeçalho institucional -->
            <div class="text-center mb-4">

                <!-- Logos UFAM e FEEC -->
                <div class="d-flex justify-content-center align-items-center gap-4 mb-3">

                    <img id="logoUfam"
                         src="../static/logo-ufam.png"
                         data-dark="../static/logo-ufam.png"
                         data-light="../static/logo-ufam-light.svg"
                         alt="Logo UFAM"
                         width="110">

                    <img id="logoFeec"
                         src="../static/logo-feec3.png"
                         data-dark="../static/logo-feec3.png"
                         data-light="../static/logo-feec3.png"
                         alt="Logo FEEC"
                         width="90">

                </div>

                <!-- Logo PPGEE -->
                <div class="mb-4">

                    <img id="logoPpgee"
                         src="../static/ppgee-branca.png"
                         data-dark="../static/ppgee-branca.png"
                         data-light="../static/ppgee-colorido.png"
                         alt="Logo PPGEE"
                         width="120">

                </div>

                <!-- Selo de área restrita -->
                <span class="badge bg-danger mb-2 px-3 py-2 d-inline-block text-uppercase shadow-sm"
                      style="letter-spacing: 0.5px;">

                    ÁREA RESTRITA

                </span>

                <!-- Título -->
                <h5 class="fw-bold mt-2"
                    style="color: var(--texto-titulo) !important;">

                    Painel do Administrador

                </h5>

                <p class="mb-0 small"
                   style="color: var(--texto-subtitulo) !important;">

                    Gestão de Equipamentos e Reservas

                </p>

            </div>

            <!-- Formulário integrado ao FastAPI -->
            <form id="form-login-admin">

                <!-- Identificação do administrador -->
                <div class="mb-3">

                    <label for="emailAdmin"
                           class="form-label fw-semibold text-secondary small">

                        E-mail Institucional

                    </label>

                    <input type="email"
                           class="form-control"
                           id="emailAdmin"
                           name="email"
                           placeholder="Digite seu e-mail"
                           required
                           autocomplete="username">

                </div>

                <!-- Senha de acesso -->
                <div class="mb-4">

                    <label for="senhaAdmin"
                           class="form-label fw-semibold text-secondary small">

                        Senha de Acesso

                    </label>

                    <input type="password"
                           class="form-control"
                           id="senhaAdmin"
                           name="senha"
                           required
                           autocomplete="current-password">

                </div>

                <!-- Mensagem de erro retornada pela API -->
                <div id="erroLoginAdmin"
                     class="alert alert-danger d-none"
                     role="alert"
                     aria-live="polite">
                </div>

                <!-- Botão de autenticação -->
                <div class="d-grid gap-2">

                    <button type="submit"
                            class="btn btn-danger fw-bold text-uppercase shadow-sm"
                            style="padding: 12px; font-size: 1.05rem;">

                        Entrar na Administração

                    </button>

                </div>

            </form>

            <!-- Retornar ao login dos alunos -->
            <div class="text-center mt-4 pt-3 border-top"
                 style="border-color: rgba(148, 163, 184, 0.2) !important;">

                <a href="./login.html"
                   class="text-decoration-none fw-bold link-custom">

                    ← Voltar ao Login de Alunos

                </a>

            </div>

        </div>

    </div>

    <!-- Botão flutuante de tema -->
    <button class="btn-theme-toggle"
            id="themeToggle"
            title="Alternar Tema"
            type="button">

        ☀️

    </button>

    <!-- ============================================================
         SCRIPT: CONTROLE DE TEMA E LOGOS INSTITUCIONAIS
         ============================================================ -->

    <script>

        const themeToggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        // Atualiza os logos de acordo com o tema selecionado
        function atualizarLogos() {

            const isLight = body.classList.contains('light-theme');

            const logos = document.querySelectorAll(
                '#logoUfam, #logoFeec, #logoPpgee'
            );

            logos.forEach(logo => {

                const novaSrc = isLight
                    ? logo.getAttribute('data-light')
                    : logo.getAttribute('data-dark');

                if (novaSrc) {
                    logo.src = novaSrc;
                }

            });

        }

        // Recupera o tema salvo no navegador
        if (localStorage.getItem('theme') === 'light') {

            body.classList.add('light-theme');

            themeToggleBtn.innerHTML = '🌙';

        }

        atualizarLogos();

        // Alterna entre tema claro e escuro
        themeToggleBtn.addEventListener('click', () => {

            body.classList.toggle('light-theme');

            const claro = body.classList.contains('light-theme');

            localStorage.setItem(
                'theme',
                claro ? 'light' : 'dark'
            );

            themeToggleBtn.innerHTML = claro ? '🌙' : '☀️';

            atualizarLogos();

        });

    </script>

    <!-- ============================================================
         INTEGRAÇÃO COM O BACKEND FASTAPI
         ============================================================ -->

    <script type="module" src="../static/js/login-admin.js"></script>

</body>
</html>
