<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Reserva de Equipamentos FEEC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/login.css">
</head>

<body>

    <!-- Acesso administrativo -->
    <a href="./login_admin.html" class="btn-admin">
        🔒 Acesso Restrito
    </a>

    <div class="login-wrapper">
        <div class="card login-card">

            <!-- Cabeçalho institucional -->
            <div class="text-center mb-4">

                <!-- Logos UFAM e FEEC -->
                <div class="d-flex justify-content-center align-items-center gap-4 mb-3">

                    <img id="logoUfam"
                        src="../static/logo-ufam.png"
                        data-dark="../static/logo-ufam.png"
                        data-light="../static/logo-ufam-light.svg"
                        alt="Logo UFAM"
                        width="110">

                    <img id="logoFeec"
                        src="../static/logo-feec3.png"
                        data-dark="../static/logo-feec3.png"
                        data-light="../static/logo-feec3.png"
                        alt="Logo FEEC"
                        width="90">

                </div>

                <!-- Logo PPGEE -->
                <div>
                    <img id="logoPpgee"
                        src="../static/ppgee-branca.png"
                        data-dark="../static/ppgee-branca.png"
                        data-light="../static/ppgee-colorido.png"
                        alt="Logo PPGEE"
                        width="120">
                </div>

            </div>

            <!-- Formulário integrado ao FastAPI -->
            <form id="form-login">

                <!-- Identificador -->
                <div class="mb-3">
                    <label for="identificador"
                           class="form-label fw-semibold text-secondary">
                        E-mail
                    </label>

                    <input type="text"
                           class="form-control"
                           id="identificador"
                           name="identificador"
                           placeholder="Digite seu e-mail"
                           required
                           autocomplete="username">
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <label for="senha"
                           class="form-label fw-semibold text-secondary">
                        Senha
                    </label>

                    <input type="password"
                           class="form-control"
                           id="senha"
                           name="senha"
                           required
                           autocomplete="current-password">
                </div>

                <!-- Lembrar-me e recuperação de senha -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="lembrarMe"
                               disabled>

                        <label class="form-check-label small text-muted"
                               for="lembrarMe">
                            Lembrar-me
                        </label>
                    </div>

                    <a href="./esqueci_senha.html"
                       class="text-decoration-none small fw-semibold link-custom">
                        Esqueci a senha?
                    </a>

                </div>

                <!-- Mensagem de erro da autenticação -->
                <div id="erro-login"
                     class="alert alert-danger d-none"
                     role="alert"
                     aria-live="polite">
                </div>

                <!-- Botão de login -->
                <div class="d-grid gap-2 mt-2">
                    <button id="btn-entrar"
                            type="submit"
                            class="btn btn-primary fw-bold text-uppercase">
                        ENTRAR
                    </button>
                </div>

            </form>

            <!-- Cadastro -->
            <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">
                    Ainda não tem acesso?

                    <a href="./cadastro.html"
                       class="text-decoration-none fw-bold link-custom">
                        Cadastre-se aqui
                    </a>
                </p>
            </div>

        </div>
    </div>

    <!-- Alternar tema -->
    <button class="btn-theme-toggle"
            id="themeToggle"
            title="Alternar Tema"
            type="button">
        ☀️
    </button>

    <!-- Controle de tema -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const body = document.body;

        function atualizarLogos() {
            const isLight = body.classList.contains('light-theme');

            const logos = document.querySelectorAll(
                '#logoUfam, #logoFeec, #logoPpgee'
            );

            logos.forEach(logo => {
                const novaSrc = isLight
                    ? logo.getAttribute('data-light')
                    : logo.getAttribute('data-dark');

                if (novaSrc) {
                    logo.src = novaSrc;
                }
            });
        }

        // Recuperar tema salvo
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-theme');
            themeToggleBtn.innerHTML = '🌙';
        }

        atualizarLogos();

        // Alternar tema
        themeToggleBtn.addEventListener('click', () => {

            body.classList.toggle('light-theme');

            const claro = body.classList.contains('light-theme');

            localStorage.setItem(
                'theme',
                claro ? 'light' : 'dark'
            );

            themeToggleBtn.innerHTML = claro ? '🌙' : '☀️';

            atualizarLogos();
        });
    </script>

    <!-- Integração com o backend FastAPI -->
    <script type="module" src="../static/js/login.js"></script>

</body>
</html>
