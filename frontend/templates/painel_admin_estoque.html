<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Estoque - Admin FEEC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body { background-color: #f4f6f9; }
        .navbar-admin { background-color: #1e293b; }
        .table-hover tbody tr:hover { background-color: #e2e8f0; cursor: pointer; }
        .img-thumbnail-table { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-admin shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center">
                <span class="badge bg-danger me-2">ADMIN</span>
                Gerenciamento de Estoque
            </span>

            <div class="d-flex gap-2">

                <a href="./painel_admin_cadastro_materiais.html"
                   class="btn btn-success btn-sm">
                    + Novo Item
                </a>

                <a href="./painel_admin.html"
                   class="btn btn-outline-light btn-sm">
                    ← Menu
                </a>

            </div>
        </div>
    </nav>

    <div class="container">

        <!-- Mensagens retornadas pela API -->
        <div id="mensagemEstoque"
             class="alert d-none"
             role="alert"
             aria-live="polite">
        </div>

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-header bg-white p-3 border-bottom-0 d-flex justify-content-between align-items-center">

                <h6 class="fw-bold text-secondary mb-0">
                    Itens Cadastrados (<span id="contadorEstoque">—</span>)
                </h6>

                <small class="text-muted">
                    Clique em um item para editar, desabilitar ou apagar.
                </small>

            </div>

            <div class="card-body p-0 table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Foto</th>
                            <th>Equipamento / Patrimônio</th>
                            <th>Status</th>
                            <th>Estoque (Disp / Total)</th>
                            <th class="text-end pe-4">Ação</th>
                        </tr>
                    </thead>

                    <!-- Equipamentos carregados pelo JavaScript -->
                    <tbody id="corpoEstoque">

                        <tr>
                            <td colspan="5"
                                class="text-center py-5 text-muted">
                                Carregando equipamentos...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- MODAL DINÂMICO DO EQUIPAMENTO -->
    <div class="modal fade"
         id="modalItem"
         tabindex="-1"
         aria-labelledby="modalItemTitulo"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 shadow">

                <div class="modal-header bg-dark text-white border-0">

                    <h5 class="modal-title fw-bold"
                        id="modalItemTitulo">
                        Detalhes do Equipamento
                    </h5>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal"
                            aria-label="Fechar">
                    </button>

                </div>

                <!-- Formulário integrado ao JavaScript -->
                <form id="formEstoque">

                    <div class="modal-body p-4">

                        <input type="hidden"
                               name="id"
                               id="itemId">

                        <!-- Imagem do equipamento -->
                        <div class="text-center mb-4">

                            <img id="itemFoto"
                                 src="https://placehold.co/400x250/e2e8f0/1e293b?text=Sem+Foto"
                                 alt="Foto do equipamento"
                                 class="img-fluid rounded shadow-sm border"
                                 style="max-height: 200px;">

                        </div>

                        <!-- Nome do equipamento -->
                        <div class="mb-3">

                            <label class="form-label text-muted small fw-bold mb-0">
                                Nome do Equipamento
                            </label>

                            <p class="fs-5 fw-bold mb-1"
                               id="itemNome">
                                —
                            </p>

                        </div>

                        <!-- Patrimônio e observação -->
                        <div class="mb-3">

                            <label class="form-label text-muted small fw-bold mb-0">
                                Patrimônio / Observação
                            </label>

                            <p class="mb-0"
                               id="itemPatrimonio">
                                —
                            </p>

                        </div>

                        <hr>

                        <!-- Controles editáveis -->
                        <div class="row align-items-center">

                            <div class="col-6">

                                <label for="itemQuantidade"
                                       class="form-label fw-bold text-dark mb-1">
                                    Quantidade Total
                                </label>

                                <input type="number"
                                       class="form-control fw-bold text-center"
                                       name="quantidade"
                                       id="itemQuantidade"
                                       min="0"
                                       step="1"
                                       required>

                            </div>

                            <div class="col-6 text-end mt-4">

                                <button type="submit"
                                        id="btnSalvarQuantidade"
                                        name="acao"
                                        value="salvar"
                                        class="btn btn-primary fw-bold px-4">
                                    Salvar Qtd
                                </button>

                            </div>

                        </div>

                        <!-- Erros da operação -->
                        <div id="erroEstoque"
                             class="alert alert-danger d-none mt-3 mb-0"
                             role="alert">
                        </div>

                    </div>

                    <div class="modal-footer bg-light border-0 d-flex justify-content-between">

                        <!-- Habilitar ou desabilitar -->
                        <button type="button"
                                id="btnStatusItem"
                                class="btn btn-outline-secondary fw-bold">

                            <i class="bi bi-pause-circle"></i>
                            Desabilitar

                        </button>

                        <!-- Excluir equipamento -->
                        <button type="button"
                                id="btnApagarItem"
                                class="btn btn-danger fw-bold">

                            <i class="bi bi-trash3"></i>
                            Apagar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Integração com o FastAPI -->
    <script type="module" src="../static/js/painel-admin-estoque.js"></script>

</body>
</html>
