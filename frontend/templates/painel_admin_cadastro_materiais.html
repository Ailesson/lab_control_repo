<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Materiais - Admin FEEC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f4f6f9; }
        .navbar-admin { background-color: #1e293b; }
        .card-form { border-top: 4px solid #0284c7; }

        .foto-box {
            border: 2px dashed #cbd5e1;
            border-radius: .5rem;
            background: #f8fafc;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .foto-preview {
            max-width: 100%;
            max-height: 260px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <!-- NAVBAR ADMINISTRATIVA -->
    <nav class="navbar navbar-dark navbar-admin shadow-sm mb-4">

        <div class="container">

            <span class="navbar-brand mb-0 h1 d-flex align-items-center">
                <span class="badge bg-danger me-2">ADMIN</span>
                Gestão de Inventário
            </span>

            <div class="d-flex">

                <a href="./painel_admin.html"
                   class="btn btn-outline-light btn-sm me-2">
                    ← Voltar ao Menu
                </a>

                <button type="button"
                        id="btnSair"
                        class="btn btn-outline-light btn-sm">
                    Sair
                </button>

            </div>

        </div>

    </nav>

    <!-- CARTÃO DO FORMULÁRIO DE CADASTRO -->
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm card-form mb-5">

                    <div class="card-header bg-white pt-4 pb-2 border-0">

                        <h4 class="fw-bold text-dark mb-0">
                            Cadastrar Novo Equipamento
                        </h4>

                        <p class="text-muted small">
                            Adicione os detalhes do material para disponibilizá-lo para reserva.
                        </p>

                    </div>

                    <div class="card-body p-4">

                        <form id="form-cadastro-material">

                            <!-- Linha 1: Nome e patrimônio -->
                            <div class="row mb-3">

                                <div class="col-md-8">

                                    <label for="nome_equipamento"
                                           class="form-label fw-semibold text-secondary small">
                                        Nome do Equipamento/Material
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="nome_equipamento"
                                           name="nome_equipamento"
                                           placeholder="Ex: Multímetro Digital Fluke 87V"
                                           required>

                                </div>

                                <div class="col-md-4">

                                    <label for="patrimonio"
                                           class="form-label fw-semibold text-secondary small">
                                        Cód. Patrimônio
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="patrimonio"
                                           name="patrimonio"
                                           placeholder="Ex: EE-LAB-022"
                                           required>

                                </div>

                            </div>

                            <!-- Linha 2: Quantidade, categoria e estado -->
                            <div class="row mb-4">

                                <div class="col-md-3">

                                    <label for="quantidade"
                                           class="form-label fw-semibold text-secondary small">
                                        Quantidade Total
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="quantidade"
                                           name="quantidade"
                                           min="1"
                                           step="1"
                                           value="1"
                                           required>

                                </div>

                                <div class="col-md-5">

                                    <label for="categoria"
                                           class="form-label fw-semibold text-secondary small">
                                        Categoria
                                    </label>

                                    <select class="form-select"
                                            id="categoria"
                                            name="categoria"
                                            required>

                                        <option value="">Selecione...</option>

                                        <option value="medicao">
                                            Equipamento de Medição
                                        </option>

                                        <option value="ferramentas">
                                            Ferramentas Manuais
                                        </option>

                                        <option value="consumivel">
                                            Componente Consumível
                                        </option>

                                        <option value="outros">
                                            Outros
                                        </option>

                                    </select>

                                </div>

                                <div class="col-md-4">

                                    <label for="status"
                                           class="form-label fw-semibold text-secondary small">
                                        Estado Inicial
                                    </label>

                                    <select class="form-select"
                                            id="status"
                                            name="status"
                                            required>

                                        <option value="disponivel">
                                            Disponível para Reserva
                                        </option>

                                        <option value="manutencao">
                                            Em Manutenção
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <!-- Foto do equipamento -->
                            <div class="mb-4"
                                 data-foto-upload
                                 data-max-mb="5">

                                <label for="foto"
                                       class="form-label fw-semibold text-secondary small">
                                    Foto do Equipamento
                                </label>

                                <div class="foto-box">

                                    <img class="foto-preview d-none"
                                         alt="Pré-visualização da foto">

                                    <div class="foto-placeholder text-muted small">
                                        📷 Nenhuma foto selecionada
                                    </div>

                                </div>

                                <input type="file"
                                       class="form-control mt-2 foto-input"
                                       id="foto"
                                       name="foto"
                                       accept="image/jpeg,image/png,image/webp"
                                       required>

                                <div class="d-flex align-items-center gap-2 mt-2">

                                    <button type="button"
                                            class="btn btn-outline-danger btn-sm foto-remover d-none">
                                        Remover foto
                                    </button>

                                    <span class="text-danger small foto-erro"
                                          role="alert">
                                    </span>

                                </div>

                                <div class="form-text">
                                    JPG, PNG ou WEBP, até 5 MB.
                                </div>

                            </div>

                            <!-- Observações e acessórios -->
                            <div class="mb-4">

                                <label for="observacoes"
                                       class="form-label fw-semibold text-secondary small">
                                    Observações / Acessórios Incluídos
                                </label>

                                <textarea class="form-control"
                                          id="observacoes"
                                          name="observacoes"
                                          rows="2"
                                          placeholder="Ex: Acompanha pontas de prova vermelha e preta..."></textarea>

                            </div>

                            <!-- Mensagens retornadas pelo backend -->
                            <div id="mensagemCadastro"
                                 class="alert d-none"
                                 role="alert"
                                 aria-live="polite">
                            </div>

                            <!-- Botões de ação -->
                            <div class="d-flex justify-content-end gap-2 border-top pt-3">

                                <button type="reset"
                                        id="btnLimpar"
                                        class="btn btn-light border fw-bold text-secondary">
                                    Limpar Campos
                                </button>

                                <button type="submit"
                                        id="btnSalvarEquipamento"
                                        class="btn btn-primary fw-bold px-4">
                                    Salvar Equipamento
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- MODAL DE SUCESSO -->
    <div class="modal fade"
         id="modalSucesso"
         tabindex="-1"
         aria-labelledby="tituloModalSucesso"
         aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered modal-sm">

            <div class="modal-content text-center p-3 border-0 shadow">

                <div class="modal-body">

                    <div class="text-success mb-2"
                         style="font-size: 3.5rem; line-height: 1;">
                        ✓
                    </div>

                    <h5 class="fw-bold text-dark"
                        id="tituloModalSucesso">
                        Cadastrado!
                    </h5>

                    <p class="text-muted small mb-0"
                       id="mensagemSucesso">
                        O equipamento foi salvo e já está no sistema.
                    </p>

                </div>

                <div class="modal-footer justify-content-center border-0 p-0 mt-3">

                    <button type="button"
                            class="btn btn-success btn-sm px-4 fw-bold"
                            data-bs-dismiss="modal">
                        OK
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Integração com FastAPI -->
    <script type="module" src="../static/js/cadastro-materiais.js"></script>

</body>
</html>
