<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Reserva FEEC</title>

    <!-- Framework de estilos base -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS próprio do projeto -->
    <link rel="stylesheet" href="../static/login.css">
</head>
<body>

    <!-- ============================================================
         CARTÃO PRINCIPAL DO FORMULÁRIO
         ============================================================ -->
    <div class="login-wrapper">
        <div class="card login-card">

            <!-- Cabeçalho -->
            <div class="text-center mb-4">

                <!-- Logos UFAM e FEEC -->
                <div class="d-flex justify-content-center align-items-center gap-4 mb-3">

                    <img id="logoUfam"
                        src="../static/logo-ufam.svg"
                        data-dark="../static/logo-ufam-dark.png"
                        data-light="../static/logo-ufam-light.svg"
                        alt="Logo UFAM" width="110">

                    <img id="logoFeec"
                        src="../static/logo-feec3.png"
                        data-dark="../static/logo-feec3.png"
                        data-light="../static/logo-feec3.png"
                        alt="Logo FEEC" width="90">
                </div>

                <!-- Logo PPGEE -->
                <div>
                    <img id="logoPpgee"
                        src="../static/ppgee-branca.png"
                        data-dark="../static/ppgee-branca.png"
                        data-light="../static/ppgee-colorido.png"
                        alt="Logo PPGEE" width="120">
                </div>

                <h3 class="fw-bold text-white mt-3">
                    Recuperação de Senha
                </h3>

                <p class="text-muted mb-0 small">
                    Digite seu CPF cadastrado para receber as instruções de recuperação.
                </p>
            </div>

            <!-- Mensagem retornada pela API -->
            <div id="mensagemRecuperacao"
                class="alert d-none"
                role="alert"
                aria-live="polite">
            </div>

            <!-- Formulário de recuperação -->
            <form id="formRecuperarSenha">

                <div class="mb-4">
                    <label for="cpf" class="form-label fw-semibold text-secondary small">
                        CPF
                    </label>

                    <input type="text"
                        class="form-control"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        required
                        maxlength="14"
                        inputmode="numeric">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit"
                        id="btnRecuperarSenha"
                        class="btn btn-primary fw-bold text-uppercase">

                        Buscar Conta

                    </button>
                </div>

            </form>

            <!-- Link para voltar à tela de Login -->
            <div class="text-center mt-4 pt-3 border-top"
                style="border-color: rgba(148, 163, 184, 0.2) !important;">

                <a href="./login.html"
                    class="text-decoration-none fw-bold link-custom">

                    ← Voltar para o Login

                </a>
            </div>

        </div>
    </div>

    <!-- ============================================================
         Botão Flutuante de Tema
         ============================================================ -->
    <button type="button"
        class="btn-theme-toggle"
        id="themeToggle"
        title="Alternar Tema">

        ☀️

    </button>

    <!-- JavaScript responsável pela integração -->
    <script type="module" src="../static/js/recuperar-senha.js"></script>

</body>
</html>
